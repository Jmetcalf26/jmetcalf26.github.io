<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC Shows</title>
  <style>
    /* -----------------------------------------------------------------------
       CSS custom properties — change these to re-theme the whole page.
    ----------------------------------------------------------------------- */
    :root {
      --bg:            #0d0d0d;   /* page background               */
      --surface:       #181818;   /* card / button resting bg      */
      --surface-hover: #212121;   /* card / button hover bg        */
      --border:        #272727;   /* grid lines, button borders    */
      --text:          #e4e4e4;   /* primary text                  */
      --text-muted:    #666;      /* secondary / meta text         */
      --accent:        #c9a84c;   /* active state & ticket links   */
      --sold-out:      #6e3333;   /* sold-out label colour         */
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 2px;
    }

    /* -----------------------------------------------------------------------
       Reset
    ----------------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* -----------------------------------------------------------------------
       Base
    ----------------------------------------------------------------------- */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* -----------------------------------------------------------------------
       Header
    ----------------------------------------------------------------------- */
    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* -----------------------------------------------------------------------
       Venue selector — scrollable row of pill buttons
    ----------------------------------------------------------------------- */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .venue-selector-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .venue-utils {
      display: flex;
      gap: 6px;
    }

    .util-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      text-transform: uppercase;
      transition: background 0.12s, color 0.12s;
    }

    .util-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: #404040;
    }

    .venue-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .search-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: flex-start;
    }

    .search-input-wrapper {
      flex-grow: 1;
      min-width: 200px;
      max-width: 400px;
    }

    #searchInput {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      padding: 8px 12px;
      width: 100%;
    }

    .date-range {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 280px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .slider-labels input[type="date"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 2px 4px;
      outline: none;
    }

    .slider-labels input[type="date"]:focus {
      border-color: var(--accent);
    }

    .range-slider-container {
      position: relative;
      height: 20px;
      margin: 0 8px;
    }

    .range-slider-container input[type="range"] {
      position: absolute;
      width: 100%;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      background: none;
      z-index: 2;
      height: 100%;
      margin: 0;
      outline: none;
    }

    .range-slider-container input[type="range"]::-webkit-slider-thumb {
      pointer-events: all;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      -webkit-appearance: none;
    }

    .range-slider-container input[type="range"]::-moz-range-thumb {
      pointer-events: all;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .slider-track {
      position: absolute;
      height: 4px;
      width: 100%;
      background: var(--border);
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      border-radius: 2px;
    }

    .slider-range {
      position: absolute;
      height: 4px;
      background: var(--accent);
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      opacity: 0.3;
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--accent);
    }

    .venue-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .venue-btn:hover {
      background: var(--surface-hover);
      border-color: #404040;
      color: var(--text);
    }

    /* Active venue is highlighted with the accent colour */
    .venue-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }

    /* -----------------------------------------------------------------------
       Status line — "Loading…", "Showing cached results.", etc.
    ----------------------------------------------------------------------- */
    .status {
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      min-height: 1.2em;          /* keep layout stable when empty */
      margin-bottom: 1.25rem;
    }

    /* -----------------------------------------------------------------------
       Shows grid — 1-px hairline grid using parent bg as the line colour
    ----------------------------------------------------------------------- */
    #showsGrid {
      display: grid;
      /* Each column is at least 240px; fills remaining space automatically */
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1px;
      background: var(--border);  /* the 1-px gaps reveal this as grid lines */
    }

    /* -----------------------------------------------------------------------
       Show card
    ----------------------------------------------------------------------- */
    .show-card {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 1.1rem 1.25rem;
      transition: background 0.1s;
    }

    .show-card:hover {
      background: var(--surface-hover);
    }

    /* Artist name — most prominent element on the card */
    .show-artist {
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
    }

    /* Date line: "Fri 21 Feb" */
    .show-date {
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    /* Doors line: "Doors 8PM" */
    .show-doors {
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    /* Opener line: "w/ Opening Act" */
    .show-opener {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-style: italic;
    }

    /* Spacer between metadata and the ticket CTA */
    .show-footer {
      margin-top: 8px;
    }

    /* Ticket link — styled as a small uppercase label */
    .ticket-link {
      color: var(--accent);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .ticket-link:hover {
      text-decoration: underline;
    }

    /* Price label (Songbyrd returns a dollar amount instead of a URL) */
    .ticket-price {
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }

    /* Sold-out label */
    .sold-out {
      color: var(--sold-out);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* -----------------------------------------------------------------------
       Loading skeleton — shimmer animation while scraper runs
    ----------------------------------------------------------------------- */

    /* Skeleton card shares the same padding as a real card */
    .skeleton-card {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 1.1rem 1.25rem;
    }

    /* Generic shimmer bar */
    .skeleton-line {
      background: linear-gradient(
        90deg,
        var(--surface) 25%,
        var(--surface-hover) 50%,
        var(--surface) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      height: 12px;
    }

    /* Width variants for variety */
    .skeleton-line         { width: 75%; }
    .skeleton-line.short   { width: 40%; }
    .skeleton-line.long    { width: 90%; }
    .skeleton-line.xshort  { width: 25%; }

    @keyframes shimmer {
      0%   { background-position:  200% 0; }
      100% { background-position: -200% 0; }
    }

    /* -----------------------------------------------------------------------
       Empty / error states
    ----------------------------------------------------------------------- */
    .empty-msg,
    .error-msg {
      color: var(--text-muted);
      font-size: 0.8rem;
      grid-column: 1 / -1;   /* span all columns */
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .error-msg {
      color: #884444;
    }
  </style>
</head>
<body>

  <header>
    <h1>DC Shows</h1>
  </header>

  <div class="controls-container">
    <!-- Search Bar and Date Range -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="Search artists or openers..." aria-label="Search shows">
      </div>
      <div class="date-range">
        <div class="slider-labels">
          <input type="date" id="dateInputMin" aria-label="Start date">
          <input type="date" id="dateInputMax" aria-label="End date">
        </div>
        <div class="range-slider-container">
          <div class="slider-track"></div>
          <div id="sliderRange" class="slider-range"></div>
          <input type="range" id="rangeMin" step="1">
          <input type="range" id="rangeMax" step="1">
        </div>
      </div>
    </div>

    <!-- Venue selector pills — populated by buildVenueSelector() -->
    <div class="venue-selector-container">
      <div class="venue-utils">
        <button class="util-btn" id="selectAllVenues">Select All</button>
        <button class="util-btn" id="invertVenues">Invert Selection</button>
      </div>
      <nav class="venue-selector" id="venueSelector" aria-label="Venue selector"></nav>
    </div>
  </div>

  <!-- Status line shown below selector: "Loading…", "Showing cached results.", etc. -->
  <div class="status" id="status" aria-live="polite"></div>

  <!-- Show cards grid — populated by renderShows() or renderSkeleton() -->
  <main id="showsGrid" aria-live="polite"></main>

  <script>
    // =========================================================================
    // Configuration
    // =========================================================================

    /**
     * Human-readable display names for each venue class name.
     * Used by buildVenueSelector() and nowhere else.
     * Add an entry here when you add a new venue to the Python side.
     */
    const VENUE_DISPLAY = {
      NineThirty:       '9:30 Club',
      Atlantis:         'The Atlantis',
      DC9:              'DC9',
      Songbyrd:         'Songbyrd',
      PieShop:          'Pie Shop',
      UnionStage:       'Union Stage',
      JamminJava:       'Jammin Java',
      CapitalTurnaround:'Capital Turnaround',
      TheHoward:        'The Howard',
      MiracleTheatre:   'Miracle Theatre',
      NatsPark:         'Nats Park',
      PearlStreet:      'Pearl Street',
      BlackCat:         'Black Cat',
      ThePocket:        'The Pocket',
    };

    /**
     * Numeric month index (1-based) → 3-letter abbreviation.
     * Used by formatDate() to convert Songbyrd's numeric month strings.
     */
    const MONTHS = [
      'Jan','Feb','Mar','Apr','May','Jun',
      'Jul','Aug','Sep','Oct','Nov','Dec',
    ];

    // =========================================================================
    // State
    // =========================================================================

    /** Set of currently selected venue class names. */
    let selectedVenues = new Set();
    let searchTerm = '';
    let startDate = '';
    let endDate = '';
    let debounceTimer;
    let minTimestamp, maxTimestamp;

    // =========================================================================
    // DOM references
    // =========================================================================

    const venueSelector = document.getElementById('venueSelector');
    const showsGrid     = document.getElementById('showsGrid');
    const statusEl      = document.getElementById('status');
    const searchInput   = document.getElementById('searchInput');
    const rangeMinInput = document.getElementById('rangeMin');
    const rangeMaxInput = document.getElementById('rangeMax');
    const dateInputMin  = document.getElementById('dateInputMin');
    const dateInputMax  = document.getElementById('dateInputMax');
    const sliderRange   = document.getElementById('sliderRange');
    const selectAllBtn  = document.getElementById('selectAllVenues');
    const invertBtn     = document.getElementById('invertVenues');

    /** List of all available venue class names. */
    let allVenues = [];

    // =========================================================================
    // Initialisation
    // =========================================================================

    /**
     * Entry point — fetch the venue list from the server and build the UI.
     * Auto-selects the first venue so the page isn't blank on arrival.
     */
    async function init() {
      try {
        const [venuesRes, rangeRes] = await Promise.all([
          fetch('/api/venues'),
          fetch('/api/date-range')
        ]);
        
        allVenues = await venuesRes.json();
        const range = await rangeRes.json();
        
        buildVenueSelector(allVenues);
        initDateSlider(range.min, range.max);

        if (allVenues.length > 0) {
          toggleVenue(allVenues[0]);
        }

        searchInput.addEventListener('input', (e) => {
          searchTerm = e.target.value;
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => loadShows(), 300);
        });

        rangeMinInput.addEventListener('input', (e) => updateSliderUI(e));
        rangeMinInput.addEventListener('change', () => loadShows());
        rangeMaxInput.addEventListener('input', (e) => updateSliderUI(e));
        rangeMaxInput.addEventListener('change', () => loadShows());

        dateInputMin.addEventListener('change', (e) => {
          const val = new Date(e.target.value).getTime();
          if (!isNaN(val)) {
            rangeMinInput.value = Math.max(minTimestamp, Math.min(val, parseInt(rangeMaxInput.value)));
            updateSliderUI();
            loadShows();
          }
        });

        dateInputMax.addEventListener('change', (e) => {
          const val = new Date(e.target.value).getTime();
          if (!isNaN(val)) {
            rangeMaxInput.value = Math.min(maxTimestamp, Math.max(val, parseInt(rangeMinInput.value)));
            updateSliderUI();
            loadShows();
          }
        });

        selectAllBtn.addEventListener('click', () => {
          selectedVenues = new Set(allVenues);
          updateVenueButtons();
          loadShows();
        });

        invertBtn.addEventListener('click', () => {
          const nextSelection = new Set();
          for (const v of allVenues) {
            if (!selectedVenues.has(v)) nextSelection.add(v);
          }
          selectedVenues = nextSelection;
          updateVenueButtons();
          loadShows();
        });

      } catch (e) {
        setStatus('Could not reach the server.');
      }
    }

    function initDateSlider(min, max) {
      if (!min || !max) return;
      
      const minD = new Date(min);
      const maxD = new Date(max);
      
      minTimestamp = minD.getTime();
      maxTimestamp = maxD.getTime();
      
      rangeMinInput.min = minTimestamp;
      rangeMinInput.max = maxTimestamp;
      rangeMinInput.value = minTimestamp;
      
      rangeMaxInput.min = minTimestamp;
      rangeMaxInput.max = maxTimestamp;
      rangeMaxInput.value = maxTimestamp;
      
      updateSliderUI();
    }

    function updateSliderUI(e) {
      const minVal = parseInt(rangeMinInput.value);
      const maxVal = parseInt(rangeMaxInput.value);
      
      // Prevent handles from crossing
      if (minVal > maxVal) {
        if (e && e.target.id === 'rangeMin') {
          rangeMinInput.value = maxVal;
        } else {
          rangeMaxInput.value = minVal;
        }
      }
      
      const currentMin = parseInt(rangeMinInput.value);
      const currentMax = parseInt(rangeMaxInput.value);
      
      startDate = new Date(currentMin).toISOString().split('T')[0];
      endDate = new Date(currentMax).toISOString().split('T')[0];
      
      dateInputMin.value = startDate;
      dateInputMax.value = endDate;
      
      const range = maxTimestamp - minTimestamp;
      if (range > 0) {
        const percentMin = ((currentMin - minTimestamp) / range) * 100;
        const percentMax = ((currentMax - minTimestamp) / range) * 100;
        
        sliderRange.style.left = percentMin + '%';
        sliderRange.style.width = (percentMax - percentMin) + '%';
      }
    }

    // =========================================================================
    // Venue selector
    // =========================================================================

    /**
     * Build one <button> per venue and append them to #venueSelector.
     * @param {string[]} venues  Array of venue class name strings from /api/venues.
     */
    function buildVenueSelector(venues) {
      venueSelector.innerHTML = '';
      for (const venue of venues) {
        const btn = document.createElement('button');
        btn.className        = 'venue-btn';
        btn.textContent      = VENUE_DISPLAY[venue] ?? venue;
        btn.dataset.venue    = venue;
        btn.addEventListener('click', () => toggleVenue(venue));
        venueSelector.appendChild(btn);
      }
    }

    /**
     * Toggle a venue in the selection and kick off a data load.
     * @param {string} venue  Venue class name.
     */
    function toggleVenue(venue) {
      if (selectedVenues.has(venue)) {
        selectedVenues.delete(venue);
      } else {
        selectedVenues.add(venue);
      }

      updateVenueButtons();
      loadShows();
    }

    function updateVenueButtons() {
      for (const btn of venueSelector.querySelectorAll('.venue-btn')) {
        btn.classList.toggle('active', selectedVenues.has(btn.dataset.venue));
      }
    }

    // =========================================================================
    // Data loading
    // =========================================================================

    /**
     * Fetch shows for selected venues and search term.
     */
    async function loadShows() {
      if (selectedVenues.size === 0 && !searchTerm && !startDate && !endDate) {
        showsGrid.innerHTML = '<div class="empty-msg">Select a venue, enter a search term, or specify a date range.</div>';
        setStatus('');
        return;
      }

      setStatus('Loading\u2026');
      renderSkeleton();

      try {
        const params = new URLSearchParams();
        if (selectedVenues.size > 0) {
          params.append('venue', Array.from(selectedVenues).join(','));
        }
        if (searchTerm) {
          params.append('search', searchTerm);
        }
        if (startDate) {
          params.append('startDate', startDate);
        }
        if (endDate) {
          params.append('endDate', endDate);
        }

        const res = await fetch(`/api/scrape?${params.toString()}`);

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          setStatus(`Error: ${err.error ?? res.statusText}`);
          showsGrid.innerHTML = '';
          return;
        }

        const { shows, cached } = await res.json();

        setStatus(cached ? 'Showing cached results.' : '');
        renderShows(shows);

      } catch (e) {
        setStatus('Failed to load shows.');
        showsGrid.innerHTML = '<div class="error-msg">Could not connect to the server.</div>';
      }
    }

    // =========================================================================
    // Rendering
    // =========================================================================

    /**
     * Fill #showsGrid with placeholder skeleton cards while data loads.
     * Uses 6 cards to give a representative feel of the real layout.
     */
    function renderSkeleton() {
      const cards = Array.from({ length: 6 }, () => `
        <div class="skeleton-card" aria-hidden="true">
          <div class="skeleton-line long"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line xshort"></div>
        </div>
      `).join('');
      showsGrid.innerHTML = cards;
    }

    /**
     * Render an array of show objects into #showsGrid.
     * @param {Object[]} shows  Array of show dicts returned by the scraper.
     */
    function renderShows(shows) {
      if (!shows || shows.length === 0) {
        showsGrid.innerHTML = '<div class="empty-msg">No matches found.</div>';
        return;
      }
      showsGrid.innerHTML = shows.map(renderCard).join('');
    }

    /**
     * Build a single show card's HTML string.
     */
    function renderCard(show) {
      const dateStr   = formatDate(show);
      const openerStr = formatOpener(show.opener);
      const ticketHtml = renderTicket(show.link);
      const venueName = VENUE_DISPLAY[show.venue] ?? show.venue;

      return `
        <article class="show-card">
          <div class="show-venue" style="color: var(--accent); font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-bottom: 2px;">${escHtml(venueName)}</div>
          <div class="show-artist">${escHtml(show.artist ?? 'TBA')}</div>
          ${dateStr   ? `<div class="show-date">${escHtml(dateStr)}</div>` : ''}
          ${show.doors ? `<div class="show-doors">Doors ${escHtml(show.doors)}</div>` : ''}
          ${openerStr  ? `<div class="show-opener">w/ ${escHtml(openerStr)}</div>` : ''}
          <div class="show-footer">${ticketHtml}</div>
        </article>
      `;
    }

    /**
     * Build a human-readable date string from the show dict.
     * Songbyrd stores months as zero-padded numbers ("02"); others use text ("Feb").
     * @param  {Object} show
     * @returns {string}  e.g. "Fri 21 Feb" or ""
     */
    function formatDate(show) {
      const parts = [];
      if (show.dayOfWeek) parts.push(show.dayOfWeek);
      if (show.day)       parts.push(show.day);
      if (show.month) {
        const n = parseInt(show.month, 10);
        // If month is numeric (1-12), convert to abbreviation; otherwise use as-is.
        parts.push((!isNaN(n) && n >= 1 && n <= 12) ? MONTHS[n - 1] : show.month);
      }
      return parts.join(' ');
    }

    /**
     * Normalise the opener field which varies by venue:
     *  - string: most venues
     *  - string[]: DC9
     *  - undefined/null: no opener
     * @param  {string|string[]|undefined} opener
     * @returns {string}
     */
    function formatOpener(opener) {
      if (!opener) return '';
      if (Array.isArray(opener)) return opener.join(', ');
      return String(opener);
    }

    /**
     * Build the ticket section HTML for a card.
     *
     * The `link` field has three possible shapes:
     *   URL string  → render as an anchor ("Tickets →")
     *   number      → Songbyrd ticket price in dollars ("$20")
     *   absent      → sold out
     *
     * "N/A" links (USP venues with no ticket URL yet) are suppressed.
     *
     * @param  {string|number|undefined} link
     * @returns {string}  HTML snippet
     */
    function renderTicket(link) {
      if (link == null) {
        return '<span class="sold-out">Sold Out</span>';
      }

      // Numeric value = Songbyrd price amount
      const asNum = Number(link);
      if (!isNaN(asNum) && typeof link === 'number') {
        return `<span class="ticket-price">$${asNum}</span>`;
      }

      const linkStr = String(link).trim();
      if (!linkStr || linkStr.toLowerCase() === 'n/a') {
        return ''; // No ticket info available yet
      }

      // Validate it looks like a URL before rendering as a link
      if (linkStr.startsWith('http')) {
        return `<a class="ticket-link" href="${escHtml(linkStr)}" target="_blank" rel="noopener noreferrer">Tickets →</a>`;
      }

      // Fallback: render as plain text
      return `<span class="ticket-price">${escHtml(linkStr)}</span>`;
    }

    // =========================================================================
    // Utilities
    // =========================================================================

    /**
     * Escape HTML special characters to prevent XSS when interpolating
     * scraped strings into innerHTML.
     * @param  {string} str
     * @returns {string}
     */
    function escHtml(str) {
      return String(str)
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#39;');
    }

    /**
     * Update the status line beneath the venue selector.
     * @param {string} msg  Message to display (empty = clear).
     */
    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // =========================================================================
    // Boot
    // =========================================================================

    init();
  </script>
</body>
</html>
