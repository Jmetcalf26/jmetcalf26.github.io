<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile - DC Shows</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #181818;
      --surface-hover: #212121;
      --border: #272727;
      --text: #e4e4e4;
      --text-muted: #666;
      --accent: #c9a84c;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --radius: 2px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      padding: 2.5rem 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
    }

    h1 { font-size: 1.5rem; color: var(--accent); }
    h2 { font-size: 1rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }

    .profile-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .profile-grid { grid-template-columns: 1fr; }
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
    }

    .show-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .show-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .show-info { font-size: 0.9rem; }
    .show-venue { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

    .friend-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .friend-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .util-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 4px 10px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .util-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .logout-btn { color: #ff4444; border-color: #442222; }
    
    .remove-btn {
      color: #884444;
      border-color: #331111;
      margin-left: 10px;
    }
    
    .remove-btn:hover {
      background: #331111;
      color: #ff4444;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="welcomeUser">Your Profile</h1>
    <div>
      <a href="/" class="util-btn">Back to Shows</a>
      <button id="logoutBtn" class="util-btn logout-btn">Logout</button>
    </div>
  </header>

  <div class="profile-grid">
    <div class="main-col">
      <div class="section">
        <h2>Shows You're Going To</h2>
        <div id="goingShows" class="show-list">Loading...</div>
      </div>
      <div class="section">
        <h2>Interested Shows</h2>
        <div id="interestedShows" class="show-list">Loading...</div>
      </div>
    </div>
    <div class="side-col">
      <div class="section">
        <h2>Friends</h2>
        <div id="friendsList" class="friend-list">Feature coming soon...</div>
      </div>
      <div class="section">
        <h2>Friend Activity</h2>
        <div id="friendActivity" class="show-list">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const mainCol = document.querySelector('.main-col');

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return '';
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#39;');
    }

    async function init() {
      const userRes = await fetch('/api/auth/me');
      const user = await userRes.json();
      if (!user) {
        window.location.href = '/auth.html';
        return;
      }

      document.getElementById('welcomeUser').textContent = `Hi, ${escHtml(user.username)}`;

      loadUserContent();
    }

    async function loadUserContent() {
      try {
        // Since we don't have a specific "my shows" endpoint yet, 
        // we can reuse the scrape endpoint with a special flag or just filter manually.
        const res = await fetch('/api/scrape?venue=NineThirty,Atlantis,DC9,Songbyrd,BlackCat,ThePocket,PieShop,UnionStage,JamminJava,CapitalTurnaround,TheHoward,MiracleTheatre,NatsPark,PearlStreet');
        const { shows } = await res.json();

        const going = shows.filter(s => s.userStatus === 'going');
        const interested = shows.filter(s => s.userStatus === 'interested');

        renderList('goingShows', going);
        renderList('interestedShows', interested);

        const activityRes = await fetch('/api/friends/activity');
        const activity = await activityRes.json();
        renderActivity(activity);

      } catch (e) {
        console.error(e);
      }
    }

    function renderList(id, shows) {
      const el = document.getElementById(id);
      if (shows.length === 0) {
        el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No shows found.</div>';
        return;
      }
      el.innerHTML = shows.map(s => `
        <div class="show-item">
          <div>
            <div class="show-venue">${escHtml(s.venue)}</div>
            <div class="show-info">${escHtml(s.artist)}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-size: 0.75rem; color: var(--text-muted);">${escHtml(s.month)} ${escHtml(s.day)}</div>
            <button class="util-btn remove-btn" data-show-id="${s.id}">Remove</button>
          </div>
        </div>
      `).join('');
    }

    // Use event delegation for remove buttons
    mainCol.addEventListener('click', (e) => {
      const btn = e.target.closest('.remove-btn');
      if (btn) {
        removeStatus(btn.dataset.showId);
      }
    });

    async function removeStatus(showId) {
      const res = await fetch(`/api/user/shows/${showId}`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'X-CSRF-Token': getCookie('csrfToken')
        },
        body: JSON.stringify({ status: null })
      });
      
      if (res.ok) {
        loadUserContent(); // Reload lists
      }
    }

    function renderActivity(activity) {
      const el = document.getElementById('friendActivity');
      if (!activity || activity.length === 0) {
        el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No recent activity.</div>';
        return;
      }
      el.innerHTML = activity.map(a => `
        <div class="show-item" style="flex-direction: column; align-items: flex-start;">
          <div style="font-size: 0.8rem;"><strong style="color: var(--accent);">${escHtml(a.username)}</strong> is ${escHtml(a.status)}</div>
          <div style="font-size: 0.75rem;">${escHtml(a.artist)} @ ${escHtml(a.venue_name)}</div>
        </div>
      `).join('');
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { 
        method: 'POST',
        headers: { 'X-CSRF-Token': getCookie('csrfToken') }
      });
      window.location.href = '/';
    });

    init();
  </script>
</body>
</html>
